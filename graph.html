// ============ CALCULATE POSITIONS ============
let width = window.innerWidth;
let height = window.innerHeight;
let cx = width / 2;
let cy = height / 2;

function calculatePositions() {
  cx = width / 2;
  cy = height / 2;

  const kh = nodes.find(n => n.isCenter);
  if (kh) { kh.x = cx; kh.y = cy; }

  const ringNodes = nodes.filter(n => !n.isCenter);
  const totalGapAngle = GAP_ANGLE * ringOrder.length;
  const availableAngle = 360 - totalGapAngle;
  const anglePerNode = availableAngle / ringNodes.length;

  let currentAngle = 270;

  ringOrder.forEach(ring => {
    const cfg = ringConfig[ring];
    const thisRingNodes = ringNodes.filter(n => n.ring === ring);
    const nodeCount = thisRingNodes.length;
    const ringAngleRange = nodeCount * anglePerNode;

    thisRingNodes.forEach((n, i) => {
      const angleDeg = currentAngle + i * anglePerNode + anglePerNode / 2;
      const angleRad = angleToRad(angleDeg);
      const r = n.isAnchor ? INNER_RADIUS : OUTER_RADIUS;
      n.x = cx + r * Math.cos(angleRad);
      n.y = cy + r * Math.sin(angleRad);
      n.angleDeg = angleDeg;
      n.angleRad = angleRad;
    });

    const midAngleDeg = currentAngle + ringAngleRange / 2;
    cfg.midAngleDeg = midAngleDeg;
    cfg.midAngleRad = angleToRad(midAngleDeg);
    cfg.angleRange = ringAngleRange;

    currentAngle += ringAngleRange + GAP_ANGLE;
  });
}

// ============ SECTOR BACKGROUNDS ============
function ringSectorPath(midAngleDeg, halfRangeDeg, innerR, outerR) {
  const a1 = angleToRad(midAngleDeg - halfRangeDeg);
  const a2 = angleToRad(midAngleDeg + halfRangeDeg);
  const x1 = cx + outerR * Math.cos(a1);
  const y1 = cy + outerR * Math.sin(a1);
  const x2 = cx + outerR * Math.cos(a2);
  const y2 = cy + outerR * Math.sin(a2);
  const x3 = cx + innerR * Math.cos(a2);
  const y3 = cy + innerR * Math.sin(a2);
  const x4 = cx + innerR * Math.cos(a1);
  const y4 = cy + innerR * Math.sin(a1);
  const largeArc = Math.abs(a2 - a1) > Math.PI ? 1 : 0;
  return `M${x1},${y1} A${outerR},${outerR} 0 ${largeArc},1 ${x2},${y2} L${x3},${y3} A${innerR},${innerR} 0 ${largeArc},0 ${x4},${y4}Z`;
}

const sectorGroup = g.append('g').attr('class', 'sectors');
const sectorData = ringOrder.map(ring => ({ ring }));

function drawSectors() {
  sectorGroup.selectAll('path')
    .data(sectorData)
    .join('path')
    .attr('d', d => {
      const cfg = ringConfig[d.ring];
      return ringSectorPath(cfg.midAngleDeg, cfg.angleRange / 2 + 0.5, 180, 420);
    })
    .attr('fill', d => ringConfig[d.ring].color)
    .attr('fill-opacity', d => focusedRing === d.ring ? 0.08 : 0.035)
    .attr('stroke', d => ringConfig[d.ring].color)
    .attr('stroke-opacity', 0.1)
    .attr('stroke-width', 1)
    .attr('stroke-dasharray', '3,3')
    .attr('data-sector-ring', d => d.ring);
}

const valueRingGroup = g.append('g').attr('class', 'value-ring-group');

function drawValueRing() {
  const anchorNodes = ringOrder.map(ring => nodeIdMap[ringConfig[ring].nodes[0]]).filter(n => n);
  if (anchorNodes.length < 2) return;

  let d = `M${anchorNodes[0].x},${anchorNodes[0].y}`;
  for (let i = 0; i < anchorNodes.length; i++) {
    const curr = anchorNodes[i];
    const next = anchorNodes[(i + 1) % anchorNodes.length];
    const mx = (curr.x + next.x) / 2;
    const my = (curr.y + next.y) / 2;
    d += ` Q${curr.x},${curr.y} ${mx},${my} T${next.x},${next.y}`;
  }

  valueRingGroup.selectAll('.value-ring-path').remove();
  valueRingGroup.append('path')
    .attr('class', 'value-ring-path')
    .attr('d', d)
    .attr('stroke', '#2a3e50')
    .attr('stroke-width', 2.5)
    .attr('stroke-opacity', 0.12)
    .attr('stroke-dasharray', '6,5');
}

function initParticles() {
  const dataflowEdges = displayEdges.filter(e => e.type === 'dataflow' && !e.suggested);
  const particleData = dataflowEdges.map((e, i) => ({
    edgeIdx: displayEdges.indexOf(e),

    speed: 0.5 + Math.random() * 0.7
  }));

  particleGroup.selectAll('.particle')
    .data(particleData)
    .join('circle')
    .attr('class', 'particle')
    .attr('r', 2.2)
    .attr('fill', '#4a80a8')
    .attr('opacity', 0.85);
}

function animateParticles() {
  particleGroup.selectAll('.particle')
    .each(function(d) {
      const pathNode = link.nodes()[d.edgeIdx];
      if (!pathNode) return;
      const len = pathNode.getTotalLength();
      if (!len) return;
      d.offset += d.speed;
      if (d.offset > len) d.offset = 0;
      const pt = pathNode.getPointAtLength(d.offset);
      d3.select(this).attr('cx', pt.x).attr('cy', pt.y);
    });
  requestAnimationFrame(animateParticles);
}

// ============ ENTRY ANIMATION ============
function runEntryAnimation() {
  try {
    document.getElementById('loading-screen').classList.add('hidden');

    const startTime = performance.now();
    const duration = 800;
    const stagger = 25;
    let animId = null;
    let finished = false;

    function easeCubicOut(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function tick() {
      if (finished) return;
      const elapsed = performance.now() - startTime;
      let allDone = true;

      nodeG.each(function(d, i) {
        const delay = i * stagger;
        let t = (elapsed - delay) / duration;
        if (t < 0) {
          allDone = false;
          return;
        }
        if (t < 1) allDone = false;
        t = Math.max(0, Math.min(1, t));
        const p = easeCubicOut(t);

        const x = cx + (d.x - cx) * p;
        const y = cy + (d.y - cy) * p;
        d3.select(this)
          .attr('transform', `translate(${x},${y})`)
          .style('opacity', p);
      });

      // Links fade in after 400ms
      const linkT = Math.min(1, Math.max(0, (elapsed - 400) / 500));
      if (linkT > 0) {
        const lp = easeCubicOut(linkT);
        link.attr('stroke-opacity', d => {
          if (d.type === 'valueRing') return 0.12 * lp;
          return (d.suggested ? 0.65 : 0.85) * lp;
        });
      }

      // Link labels after 900ms
      if (elapsed > 900) {
        linkLabelGroup.selectAll('.link-label, .link-label-bg').classed('visible', true);
      }

      if (!allDone) {
        animId = requestAnimationFrame(tick);
      } else {
        finished = true;
        restoreFromHash();
      }
    }

    animId = requestAnimationFrame(tick);

    // Fallback: force finish after 3s
    setTimeout(() => {
      if (!finished) {
        finished = true;
        if (animId) cancelAnimationFrame(animId);
        nodeG.attr('transform', d => `translate(${d.x},${d.y})`).style('opacity', 1);
        link.attr('stroke-opacity', d => {
          if (d.type === 'valueRing') return 0.12;
          return d.suggested ? 0.65 : 0.85;
        });
        restoreFromHash();
      }
    }, 3000);

  } catch (e) {
    console.error('Entry animation error:', e);
    document.getElementById('loading-screen').classList.add('hidden');
    nodeG.attr('transform', d => `translate(${d.x},${d.y})`).style('opacity', 1);
    link.attr('stroke-opacity', d => d.type === 'valueRing' ? 0.12 : (d.suggested ? 0.65 : 0.85));
    restoreFromHash();
  }
}

// ============ MINIMAP ============
const minimapW = 130, minimapH = 90;
const minimapSvg = d3.select('#minimap')
  .append('svg')
  .attr('width', minimapW)
  .attr('height', minimapH);

const minimapG = minimapSvg.append('g');

// Compute bounds for minimap normalization
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
nodes.forEach(n => {
  if (n.x < minX) minX = n.x;
  if (n.x > maxX) maxX = n.x;
  if (n.y < minY) minY = n.y;
  if (n.y > maxY) maxY = n.y;
});
const boundsPad = 60;
minX -= boundsPad; maxX += boundsPad;
minY -= boundsPad; maxY += boundsPad;
const boundsW = maxX - minX;
const boundsH = maxY - minY;
const scale = Math.min(minimapW / boundsW, minimapH / boundsH);
const offsetX = (minimapW - boundsW * scale) / 2;
const offsetY = (minimapH - boundsH * scale) / 2;

function worldToMinimap(x, y) {
  return [(x - minX) * scale + offsetX, (y - minY) * scale + offsetY];
}

// Draw minimap nodes
minimapG.selectAll('.mm-node')
  .data(nodes)
  .join('circle')
  .attr('class', 'mm-node')
  .attr('cx', d => worldToMinimap(d.x, d.y)[0])
  .attr('cy', d => worldToMinimap(d.x, d.y)[1])
  .attr('r', d => d.isCenter ? 3 : (d.isAnchor ? 2 : 1.5))
  .attr('fill', d => d.isCenter ? '#4a9a6d' : d.ringColor)
  .attr('opacity', 0.7);

// Draw minimap value ring
const mmAnchors = ringOrder.map(ring => nodeIdMap[ringConfig[ring].nodes[0]]).filter(n => n);
if (mmAnchors.length >= 2) {
  let mmD = `M${worldToMinimap(mmAnchors[0].x, mmAnchors[0].y).join(',')}`;
  for (let i = 0; i < mmAnchors.length; i++) {
    const curr = mmAnchors[i];
    const next = mmAnchors[(i + 1) % mmAnchors.length];
    const [mx, my] = worldToMinimap((curr.x + next.x) / 2, (curr.y + next.y) / 2);
    const [nx, ny] = worldToMinimap(next.x, next.y);
    mmD += ` Q${worldToMinimap(curr.x, curr.y).join(',')} ${mx},${my} T${nx},${ny}`;
  }
  minimapG.append('path')
    .attr('d', mmD)
    .attr('fill', 'none')
    .attr('stroke', '#2a3e50')
    .attr('stroke-width', 0.8)
    .attr('stroke-opacity', 0.2)
    .attr('stroke-dasharray', '2,2');
}

// Viewport rectangle
const viewportRect = minimapG.append('rect')
  .attr('fill', 'rgba(74,136,176,0.15)')
  .attr('stroke', '#4a80a8')
  .attr('stroke-width', 0.8)
  .attr('rx', 2);

function updateMinimapViewport(transform) {
  if (!transform) transform = d3.zoomIdentity;
  const invK = 1 / transform.k;
  const vx = (-transform.x) * invK;
  const vy = (-transform.y) * invK;
  const vw = width * invK;
  const vh = height * invK;

  const [x1, y1] = worldToMinimap(vx, vy);
  const [x2, y2] = worldToMinimap(vx + vw, vy + vh);

  viewportRect
    .attr('x', x1)
    .attr('y', y1)
    .attr('width', x2 - x1)
    .attr('height', y2 - y1);
}

updateMinimapViewport(d3.zoomIdentity);

  const mx = event.clientX - rect.left;

  const wx = minX + (mx - offsetX) / scale;
  const wy = minY + (my - offsetY) / scale;

// ============ DRAG ============
function dragStarted(event, d) {
  d.dragging = true;
}

function dragged(event, d) {
  d.x = event.x;
  d.y = event.y;
  d3.select(this).attr('transform', `translate(${d.x},${d.y})`);
  updateLinks();
  updateLinkLabels();
  if (d.isAnchor) drawValueRing();
}

function dragEnded(event, d) {
  d.dragging = false;
  if (d.isCenter) return;
  // Snap back to original ring position
  const r = d.isAnchor ? INNER_RADIUS : OUTER_RADIUS;
  const targetX = cx + r * Math.cos(d.angleRad);
  const targetY = cy + r * Math.sin(d.angleRad);
  d3.select(this).transition().duration(400).ease(d3.easeBackOut)
    .attr('transform', `translate(${targetX},${targetY})`)
    .on('end', function() {
      d.x = targetX;
      d.y = targetY;
      updateLinks();
      updateLinkLabels();
      if (d.isAnchor) drawValueRing();
    });
}

function getLinkControlPoint(sx, sy, tx, ty, type) {
  const mx = (sx + tx) / 2, my = (sy + ty) / 2;
  const dx = tx - sx, dy = ty - sy;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  // Perpendicular unit vector
  const nx = -dy / dist, ny = dx / dist;
  // Offset magnitude: larger for center-to-ring, smaller for intra-ring
  let offset = dist * 0.12;
  if (type === 'knowledgehub') offset = dist * 0.18;
  // For edges near top (r&d), curve outward; for others, mixed
  const midY = (sy + ty) / 2;
  const side = (midY < cy) ? -1 : 1;
  return [mx + nx * offset * side, my + ny * offset * side];
}

function getLinkPath(d) {
  if (!d || !d.source || !d.target) return '';
  const [cx1, cy1] = getLinkControlPoint(d.source.x, d.source.y, d.target.x, d.target.y, d.type);
  return `M${d.source.x},${d.source.y} Q${cx1},${cy1} ${d.target.x},${d.target.y}`;
}

function getLinkMidpoint(d) {
  if (!d || !d.source || !d.target) return [0, 0];
  const [cx1, cy1] = getLinkControlPoint(d.source.x, d.source.y, d.target.x, d.target.y, d.type);
  // Quadratic Bezier at t=0.5: B = 0.25*P0 + 0.5*P1 + 0.25*P2
  return [
    0.25 * d.source.x + 0.5 * cx1 + 0.25 * d.target.x,
    0.25 * d.source.y + 0.5 * cy1 + 0.25 * d.target.y
  ];
}

function updateLinks() {
  link.attr('d', d => getLinkPath(d));
}

function updateLinkLabels() {
  linkLabelGroup.selectAll('.link-label-g').each(function() {
    const sel = d3.select(this);
    const edgeIdx = parseInt(sel.attr('data-edge-idx'));
    const e = displayEdges[edgeIdx];
    if (!e || !e.source) return;
    const [mx, my] = getLinkMidpoint(e);
    sel.select('.link-label').attr('x', mx).attr('y', my + 2);
    const bbox = sel.select('.link-label').node().getBBox();
    sel.select('.link-label-bg')
      .attr('x', bbox.x - 3)
      .attr('y', bbox.y - 1)
      .attr('width', bbox.width + 6)
      .attr('height', bbox.height + 2);
  });
}

// ============ HIGHLIGHT ============
function getRelatedNodes(nodeId, hops) {
  const related = new Set([nodeId]);
  let frontier = new Set([nodeId]);
  for (let h = 0; h < hops; h++) {
    const next = new Set();
    frontier.forEach(id => {
      displayEdges.forEach(e => {
        if (e.type === 'valueRing') return;
        if (e.source.id === id) next.add(e.target.id);
        if (e.target.id === id) next.add(e.source.id);
      });
    });
    next.forEach(id => related.add(id));
    frontier = next;
  }
  return related;
}

function updateHighlight() {
  const edgeHoverNodes = hoveredEdge ? new Set([hoveredEdge.source.id, hoveredEdge.target.id]) : null;
  const rel = !hoveredEdge && (hoveredNodeId || selectedNodeId);
  const isKhHovered = rel === 'Sloth-KnowledgeHub-Eido';
  const relatedSet = rel ? getRelatedNodes(rel, 2) : new Set();

  nodeG.selectAll('.node-circle')
    .attr('stroke', d => {
      if (d.id === selectedNodeId) return '#f0c040';
      if (edgeHoverNodes && edgeHoverNodes.has(d.id)) return '#f0c040';
      if (!rel && searchMatches.size === 0 && !focusedRing) return '#fff';
      if (rel && relatedSet.has(d.id)) return d.ringColor;
      return '#ddd';
    })
    .attr('stroke-width', d => {
      if (d.id === selectedNodeId) return 4;
      if (edgeHoverNodes && edgeHoverNodes.has(d.id)) return 4;
      if (!rel) return d.isCenter ? 3.5 : 2.5;
      if (relatedSet.has(d.id)) return d.id === rel ? 4 : 3;
      return 1;
    });

  nodeG.attr('opacity', d => {
    if (!d.isAnchor && !d.isCenter && collapsedRings.has(d.ring)) return 0;
    if (toolCollapsed && (d.category === 'productivity' || d.category === 'den')) return 0.08;
    if (edgeHoverNodes) return edgeHoverNodes.has(d.id) ? 1 : 0.25;
    if (searchMatches.size > 0) {
      return searchMatches.has(d.id) ? 1 : 0.1;
    }
    if (focusedRing) {
      if (d.isCenter) return 0.2;
      return d.ring === focusedRing ? 1 : 0.12;
    }
    if (!rel) return 1;
    if (d.id === rel) return 1;
    return relatedSet.has(d.id) ? 1 : 0.15;
  });

  nodeG.selectAll('.label-group').style('display', d => {
    if (!d.isAnchor && !d.isCenter && collapsedRings.has(d.ring)) return 'none';
    if (toolCollapsed && (d.category === 'productivity' || d.category === 'den')) return 'none';
    return null;
  });

  function isNodeCollapsed(n) {
    return !n.isAnchor && !n.isCenter && collapsedRings.has(n.ring);
  }

  link.attr('stroke-opacity', d => {
    if (isNodeCollapsed(d.source) || isNodeCollapsed(d.target)) return 0;
    if (d.type === 'valueRing') return focusedRing ? 0.04 : 0.12;
    if (hoveredEdge) {
      return (d.source.id === hoveredEdge.source.id && d.target.id === hoveredEdge.target.id) ? 1 : 0.1;
    }
    if (d.type === 'knowledgehub' && isKhHovered) return 0.85;
    if (searchMatches.size > 0) {
      const srcMatch = searchMatches.has(d.source.id);
      const tgtMatch = searchMatches.has(d.target.id);
      return (srcMatch && tgtMatch) ? 1 : 0.04;
    }
    if (focusedRing) {
      const inFocus = (d.source.ring === focusedRing && d.target.ring === focusedRing) ||
                      (d.source.isCenter && d.target.ring === focusedRing) ||
                      (d.target.isCenter && d.source.ring === focusedRing);
      return inFocus ? (d.suggested ? 0.65 : 0.85) : 0.04;
    }
    if (!rel) {
      if (d.type === 'knowledgehub') return 0.15;
      return d.suggested ? 0.65 : 0.85;
    }
    const srcRel = relatedSet.has(d.source.id);
    const tgtRel = relatedSet.has(d.target.id);
    return (srcRel && tgtRel) ? 1 : 0.04;
  });

  // Link labels visibility
  linkLabelGroup.selectAll('.link-label-g').attr('opacity', function() {
    const idx = +this.getAttribute('data-edge-idx');
    const edgeData = displayEdges[idx];
    if (!edgeData) return 1;
    if (isNodeCollapsed(edgeData.source) || isNodeCollapsed(edgeData.target)) return 0;
    if (hoveredEdge) {
      return (edgeData.source.id === hoveredEdge.source.id && edgeData.target.id === hoveredEdge.target.id) ? 1 : 0.1;
    }
    if (edgeData.type === 'knowledgehub' && isKhHovered) return 1;
    if (focusedRing) {
      const inFocus = (edgeData.source.ring === focusedRing && edgeData.target.ring === focusedRing) ||
                      (edgeData.source.isCenter && edgeData.target.ring === focusedRing) ||
                      (edgeData.target.isCenter && edgeData.source.ring === focusedRing);
      return inFocus ? 1 : 0.04;
    }
    if (searchMatches.size > 0) {
      const srcMatch = searchMatches.has(edgeData.source.id);
      const tgtMatch = searchMatches.has(edgeData.target.id);
      return (srcMatch && tgtMatch) ? 1 : 0.04;
    }
    if (!rel) return edgeData.type === 'knowledgehub' ? 0 : 1;
    const srcRel = relatedSet.has(edgeData.source.id);
    const tgtRel = relatedSet.has(edgeData.target.id);
    return (srcRel && tgtRel) ? 1 : 0.04;
  });
}

// ============ SEARCH ============
function handleSearch(query) {
  query = query.trim().toLowerCase();
  searchMatches.clear();

  if (query.length > 0) {
    nodes.forEach(n => {
      if (n.name.toLowerCase().includes(query) ||
          n.shortName.toLowerCase().includes(query) ||
          n.id.toLowerCase().includes(query)) {
        searchMatches.add(n.id);
      }
    });
  }

  document.getElementById('search-count').textContent = searchMatches.size > 0 ? `${searchMatches.size} 个匹配` : '';
  updateHighlight();

  // If single match, center on it
  if (searchMatches.size === 1) {
    const matchId = Array.from(searchMatches)[0];
    const matchNode = nodeIdMap[matchId];
    if (matchNode) {
      svg.transition().duration(600).call(
        zoom.transform,
        d3.zoomIdentity.translate(width / 2 - matchNode.x, height / 2 - matchNode.y).scale(1.2)
      );
    }
  }
}

// ============ RING FOCUS ============
function toggleRingFocus(ring) {
  if (focusedRing === ring) {
    focusedRing = null;
  } else {
    focusedRing = ring;
  }

  document.querySelectorAll('.legend-row[data-ring]').forEach(el => {
    el.classList.toggle('active-ring', el.dataset.ring === focusedRing);
  });

  // Fade sectors
  sectorGroup.selectAll('path')
    .attr('fill-opacity', d => {
      if (!focusedRing) return 0.035;
      return d.ring === focusedRing ? 0.08 : 0.01;
    });

  updateHighlight();
}

function toggleRingCollapse(ring) {
  if (collapsedRings.has(ring)) {
    collapsedRings.delete(ring);
  } else {
    collapsedRings.add(ring);
  }
  updateHighlight();
}

  } else {
    nodeG.selectAll('.node-circle').attr('stroke-dasharray', null);
    link.classed('link-hover', false);
    updateHighlight();
  }
}

function runTopologyAnalysis() {
  // Find longest path from StratAlign to SkyHub via BFS
  const start = 'Sloth-StratAlign-Eido';
  const end = 'Sloth-SkyHub-Eido';
  const queue = [[start]];
  const visited = new Set();
  let longest = [];

  while (queue.length) {
    const path = queue.shift();
    const last = path[path.length - 1];
    if (last === end && path.length > longest.length) longest = path;
    if (visited.has(last)) continue;
    visited.add(last);

    displayEdges.forEach(e => {
      if (e.type === 'valueRing') return;
      if (e.source.id === last && !path.includes(e.target.id)) {
        queue.push([...path, e.target.id]);
      }
    });
  }

  // Find orphan nodes (no non-valueRing edges)
  const hasIn = new Set(), hasOut = new Set();
  displayEdges.forEach(e => {
    if (e.type === 'valueRing') return;
    hasOut.add(e.source.id);
    hasIn.add(e.target.id);
  });
  const orphans = nodes.filter(n => !hasIn.has(n.id) && !hasOut.has(n.id)).map(n => n.id);

  // Highlight longest path with dashed stroke
  nodeG.selectAll('.node-circle')
    .attr('stroke-dasharray', d => longest.includes(d.id) ? '4,2' : null)
    .attr('stroke', d => {
      if (orphans.includes(d.id)) return '#e85d5d';
      if (longest.includes(d.id)) return '#f0c040';
      return '#fff';
    });

  // Highlight path edges
  link.classed('link-hover', d => {
    if (d.type === 'valueRing') return false;
    const srcIdx = longest.indexOf(d.source.id);
    return srcIdx !== -1 && longest[srcIdx + 1] === d.target.id;
  });
}

// ============ SEARCH AUTOCOMPLETE ============
function handleSearchKey(e) {
  const ac = document.getElementById('search-autocomplete');
  if (e.key === 'Escape') {
    ac.classList.remove('visible');
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = ac.querySelectorAll('.ac-item');
    if (!items.length) return;
    let idx = Array.from(items).findIndex(el => el.classList.contains('active'));
    items.forEach(el => el.classList.remove('active'));
    if (e.key === 'ArrowDown') idx = Math.min(idx + 1, items.length - 1);
    else idx = Math.max(idx - 1, 0);
    if (items[idx]) {
      items[idx].classList.add('active');
      items[idx].scrollIntoView({ block: 'nearest' });
    }
    return;
  }
  if (e.key === 'Enter') {
    const active = ac.querySelector('.ac-item.active');
    if (active) {
      const nodeId = active.dataset.nodeId;
      if (nodeId) selectNodeById(nodeId);
    }
    ac.classList.remove('visible');
  }
}

function selectNodeById(nodeId) {
  const n = nodeIdMap[nodeId];
  if (!n) return;
  selectedNodeId = nodeId;
  showPanel(n);
  svg.transition().duration(600).call(
    zoom.transform,
    d3.zoomIdentity.translate(width / 2 - n.x, height / 2 - n.y).scale(1.3)
  );
  updateHighlight();
}

function updateAutocomplete(query) {
  const ac = document.getElementById('search-autocomplete');
  query = query.trim().toLowerCase();
  if (query.length === 0) {
    ac.classList.remove('visible');
    return;
  }
  const matches = nodes.filter(n =>
    n.name.toLowerCase().includes(query) ||
    n.shortName.toLowerCase().includes(query) ||
    n.id.toLowerCase().includes(query)
  ).slice(0, 8);

  if (matches.length === 0) {
    ac.innerHTML = '<div class="ac-empty">无匹配结果</div>';
  } else {
    ac.innerHTML = matches.map(n =>
      '<div class="ac-item" data-node-id="' + n.id + '" onclick="selectNodeById(\'' + n.id + '\')">' +
      '<span class="ac-dot" style="background:' + n.ringColor + '"></span>' +
      '<span>' + n.name + ' <span style="color:#9aabbb;font-size:10px">(' + n.shortName + ')</span></span>' +
      '</div>'
    ).join('');
  }
  ac.classList.add('visible');
}

// Override handleSearch to also update autocomplete
const _origHandleSearch = handleSearch;
handleSearch = function(query) {
  _origHandleSearch(query);
  updateAutocomplete(query);
};

// Close autocomplete on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('#search-box')) {
    document.getElementById('search-autocomplete').classList.remove('visible');
  }
});

// ============ URL HASH DEEP LINKING ============
function updateHash() {
  const params = new URLSearchParams();
  if (selectedNodeId) params.set('node', selectedNodeId);
  if (document.body.classList.contains('dark')) params.set('dark', '1');
  const transform = d3.zoomTransform(svg.node());
  if (transform.k !== 1 || transform.x !== 0 || transform.y !== 0) {
    params.set('zoom', transform.k.toFixed(2));
    params.set('tx', transform.x.toFixed(0));
    params.set('ty', transform.y.toFixed(0));
  }
  const hash = params.toString();
  if (hash) {
    history.replaceState(null, '', '#' + hash);
  } else {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function restoreFromHash() {
  const hash = location.hash.slice(1);
  if (!hash) {
    // Mobile: auto collapse brand ring on small screens
    if (window.innerWidth < 768) {
      collapsedRings.add('brand');
      updateHighlight();
    }
    return;
  }
  const params = new URLSearchParams(hash);

  if (params.get('dark') === '1') {
    document.body.classList.add('dark');
    document.getElementById('btn-dark').classList.add('active');
  }

  const nodeId = params.get('node');
  if (nodeId && nodeIdMap[nodeId]) {
    setTimeout(() => selectNodeById(nodeId), 300);
  }

  const zoomK = parseFloat(params.get('zoom'));
  const zoomX = parseFloat(params.get('tx'));
  const zoomY = parseFloat(params.get('ty'));
  if (!isNaN(zoomK) && !isNaN(zoomX) && !isNaN(zoomY)) {
    svg.transition().duration(800).call(
      zoom.transform,
      d3.zoomIdentity.translate(zoomX, zoomY).scale(zoomK)
    );
  }
}

// Update hash on state changes
function hookStateChanges() {
  const origShowPanel = showPanel;
  showPanel = function(d) {
    origShowPanel(d);
    updateHash();
  };
  const origClosePanel = closePanel;
  closePanel = function() {
    origClosePanel();
    updateHash();
  };
  const origToggleDark = toggleDark;
  toggleDark = function() {
    origToggleDark();
    updateHash();
  };
  const origResetView = resetView;
  resetView = function() {
    origResetView();
    updateHash();
  };
}

// ============ PERFORMANCE DEGRADATION ============
let fpsLowCount = 0;
let animationsEnabled = true;

function checkPerformance() {
  let lastTime = performance.now();
  let frames = 0;
  function measure() {
    const now = performance.now();
    frames++;
    if (now - lastTime >= 1000) {
      const fps = frames;
      frames = 0;
      lastTime = now;
      if (fps < 25) {
        fpsLowCount++;
        if (fpsLowCount >= 2 && animationsEnabled) {
          animationsEnabled = false;
          // Stop particle animation by using a no-op
          window._particleAnimating = false;
          // Stop value ring flow
          d3.selectAll('.value-ring-path').style('animation', 'none');
          console.log('Performance: animations disabled (fps=' + fps + ')');
        }
      } else {
        fpsLowCount = 0;
      }
    }
    if (animationsEnabled) requestAnimationFrame(measure);
  }
  requestAnimationFrame(measure);
}

// Override animateParticles to respect performance flag
const _origAnimateParticles = animateParticles;
animateParticles = function() {
  if (!animationsEnabled) return;
  _origAnimateParticles();
};

// ============ MOBILE ADAPTATIONS ============
function applyMobileAdaptations() {
  if (window.innerWidth < 768) {
    // Auto collapse brand ring (too many nodes)
    if (!collapsedRings.has('brand')) {
      collapsedRings.add('brand');
      updateHighlight();
    }
  }
}

// ============ INITIALIZATION ============
hookStateChanges();
checkPerformance();
window.addEventListener('resize', () => {
  applyMobileAdaptations();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePanel();
    selectedNodeId = null;
    updateHighlight();
    document.getElementById('search-autocomplete').classList.remove('visible');
  }
  if (e.key === '/' || e.key === 's') {
    if (document.activeElement !== document.getElementById('search-input')) {
      e.preventDefault();
      document.getElementById('search-input').focus();
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    resetView();
  }
});

// ============ EXPORT PNG ============
function exportPNG() {
  const svgNode = svg.node();
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svgNode);

  // Add namespaces
  if (!svgStr.includes('xmlns=')) {
    svgStr = svgStr.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }

  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = width * 2;
    canvas.height = height * 2;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#e8eef5';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const pngUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = pngUrl;
    a.download = `sloth-eido-skill-graph-${new Date().toISOString().slice(0,10)}.png`;
    a.click();
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function closePanel() {

  updateHighlight();
}
