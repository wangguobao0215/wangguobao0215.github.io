<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · 新中式国风</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: #2a2420;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: linear-gradient(180deg, #f8f4ee 0%, #f0ebe3 100%);
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    position: relative;
  }

  /* Ink texture overlay */
  .poster::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(180,160,140,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(120,100,80,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Border frame */
  .frame {
    position: absolute;
    top: 12px; left: 12px; right: 12px; bottom: 12px;
    border: 1px solid rgba(139,90,43,0.15);
    pointer-events: none;
  }
  .frame::before {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border: 0.5px solid rgba(139,90,43,0.08);
  }

  /* Header */
  .header {
    text-align: center;
    padding: 56px 40px 32px;
    position: relative;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #8b5a2b;
    margin-bottom: 16px;
  }
  .brand {
    font-size: 12px;
    color: #a08060;
    letter-spacing: 6px;
    margin-bottom: 20px;
  }
  .main-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 42px;
    color: #2a1f14;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .sub-title {
    font-size: 14px;
    color: #8b7355;
    font-weight: 300;
    line-height: 1.8;
  }

  /* Seal stamp */
  .seal {
    width: 56px;
    height: 56px;
    margin: 24px auto;
    border: 2px solid #c92a2a;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 20px;
    color: #c92a2a;
    transform: rotate(-3deg);
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 40px 28px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139,90,43,0.2), transparent);
  }
  .divider-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8b5a2b;
  }

  /* Journey */
  .journey {
    margin: 0 32px 28px;
    padding: 20px;
    background: rgba(255,255,255,0.5);
    border-top: 1px solid rgba(139,90,43,0.15);
    border-bottom: 1px solid rgba(139,90,43,0.15);
  }
  .j-label {
    font-size: 11px;
    color: #a08060;
    letter-spacing: 4px;
    margin-bottom: 12px;
    text-align: center;
  }
  .j-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .j-dot {
    font-size: 13px;
    color: #5a4a3a;
    font-weight: 600;
  }
  .j-arrow {
    color: #8b5a2b;
    font-size: 14px;
  }

  /* Stats */
  .stats {
    display: flex;
    margin: 0 32px 28px;
    gap: 16px;
  }
  .stat {
    flex: 1;
    text-align: center;
  }
  .stat-num {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 32px;
    color: #8b5a2b;
  }
  .stat-label {
    font-size: 11px;
    color: #a08060;
    margin-top: 2px;
  }

  /* Quote */
  .quote {
    margin: 0 32px 28px;
    padding: 20px 24px;
    background: rgba(139,90,43,0.04);
    border-left: 3px solid #8b5a2b;
  }
  .quote p {
    font-size: 14px;
    color: #3a2e22;
    line-height: 2;
    font-weight: 300;
  }
  .quote strong {
    color: #8b5a2b;
    font-weight: 600;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 0 32px 48px;
    position: relative;
  }
  .qr-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 12px;
    padding: 6px;
    background: #fff;
    border: 1px solid rgba(139,90,43,0.15);
    border-radius: 4px;
  }
  .qr-wrap img {
    width: 108px;
    height: 108px;
    display: block;
  }
  .qr-text {
    font-size: 13px;
    color: #5a4a3a;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .qr-sub {
    font-size: 11px;
    color: #a08060;
  }
  .slogan {
    margin-top: 16px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 18px;
    color: #8b5a2b;
    letter-spacing: 6px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="frame"></div>

  <div class="header">
    <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    <div class="brand">S L O T H  M A S T E R</div>
    
    <div class="sub-title">一个相信"慢一点，深一度"的<br>企业AI转型方法论架构师</div>
    <div class="seal">慢深</div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <div class="journey">
    <div class="j-label">二 十 八 载 旅 程</div>
    <div class="j-dots">
      <span class="j-dot">中石化</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">毕博</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">德勤</span>
      <span class="j-arrow">→</span>
      <span class="j-dot"></span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">28</div>
      <div class="stat-label">年跨度</div>
    </div>
    <div class="stat">
      <div class="stat-num">6</div>
      <div class="stat-label">方法论</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">智能体</div>
    </div>
    <div class="stat">
      <div class="stat-num">400+</div>
      <div class="stat-label">篇原创</div>
    </div>
  </div>

  <div class="quote">
    <p>技术从来不缺，缺的是让组织接住技术的方法。把28年经验蒸馏为可复用的方法论，帮企业和个人建立<strong>定义问题、梳理问题、做出判断</strong>这三种能力。</p>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="qr-text">树懒老K · 慢一点深一度</div>
    <div class="qr-sub">扫码访问个人网站，获取更多AI转型方法论</div>
    <div class="slogan">慢 一 点 深 一 度</div>
  </div>
</div>
</body>
</html>
