<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · Art Deco 装饰艺术</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+SC:wght@300;400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Cinzel", "Noto Serif SC", "PingFang SC", serif;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 0 0 4px #c9a84c, 0 0 0 8px #0a0a0a, 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
  }

  /* Art Deco patterns */
  .deco-border-top, .deco-border-bottom {
    height: 8px;
    background: repeating-linear-gradient(90deg, #c9a84c 0px, #c9a84c 20px, transparent 20px, transparent 40px);
  }
  .deco-border-bottom {
    transform: rotate(180deg);
  }

  /* Header */
  .header {
    text-align: center;
    padding: 32px 36px 24px;
    position: relative;
  }
  .deco-line {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin: 0 auto 16px;
  }
  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #c9a84c;
    margin-bottom: 16px;
    box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
  }
  .brand {
    font-size: 10px;
    color: #c9a84c;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .main-title {
    font-family: "Cinzel", serif;
    font-size: 36px;
    font-weight: 900;
    color: #f0e6d2;
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .sub-title {
    font-size: 14px;
    color: rgba(201, 168, 76, 0.8);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* Stats with Art Deco styling */
  .stats {
    display: flex;
    margin: 0 32px 24px;
    gap: 12px;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    border: 1px solid rgba(201, 168, 76, 0.3);
    position: relative;
  }
  .stat::before, .stat::after {
    content: '';
    position: absolute;
    width: 8px;
    height: 8px;
    border: 2px solid #c9a84c;
  }
  .stat::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .stat::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .stat-num {
    font-family: "Cinzel", serif;
    font-size: 28px;
    font-weight: 700;
    color: #c9a84c;
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    color: rgba(240, 230, 210, 0.7);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Journey */
  .journey {
    margin: 0 32px 24px;
    padding: 20px;
    border-left: 2px solid #c9a84c;
    border-right: 2px solid #c9a84c;
  }
  .journey-label {
    font-size: 10px;
    color: #c9a84c;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: center;
  }
  .journey-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .j-dot {
    font-size: 12px;
    color: rgba(240, 230, 210, 0.9);
    padding: 4px 12px;
    border: 1px solid rgba(201, 168, 76, 0.3);
  }
  .j-arrow {
    color: #c9a84c;
    font-size: 14px;
  }

  /* Quote */
  .quote {
    margin: 0 32px 24px;
    padding: 24px;
    text-align: center;
    position: relative;
  }
  .quote::before, .quote::after {
    content: '❖';
    display: block;
    text-align: center;
    color: #c9a84c;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .quote::after { margin-top: 12px; margin-bottom: 0; }
  .quote-text {
    font-family: "Cinzel", serif;
    font-size: 16px;
    color: rgba(240, 230, 210, 0.9);
    line-height: 1.8;
    font-style: italic;
  }

  /* Footer */
  .footer {
    padding: 24px 32px 32px;
    text-align: center;
  }
  .qr-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 12px;
    padding: 6px;
    background: rgba(201, 168, 76, 0.1);
    border: 2px solid #c9a84c;
  }
  .qr-wrap img {
    width: 104px;
    height: 104px;
    display: block;
  }
  .qr-text {
    font-size: 12px;
    color: #c9a84c;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .qr-sub {
    font-size: 10px;
    color: rgba(240, 230, 210, 0.6);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="deco-border-top"></div>

  <div class="header">
    <div class="deco-line"></div>
    <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    <div class="brand">S L O T H  M A S T E R</div>
    
    <div class="sub-title">慢一点 · 深一度</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">28</div>
      <div class="stat-label">Years</div>
    </div>
    <div class="stat">
      <div class="stat-num">6</div>
      <div class="stat-label">Methods</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">Agents</div>
    </div>
    <div class="stat">
      <div class="stat-num">400+</div>
      <div class="stat-label">Articles</div>
    </div>
  </div>

  <div class="journey">
    <div class="journey-label">The Journey</div>
    <div class="journey-dots">
      <span class="j-dot">中石化</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">毕博</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">德勤</span>
      <span class="j-arrow">→</span>
      <span class="j-dot"></span>
    </div>
  </div>

  <div class="quote">
    <div class="quote-text">技术从来不缺，缺的是让组织接住技术的方法。</div>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="qr-text">Scan to Visit</div>
    <div class="qr-sub">扫码访问个人网站</div>
  </div>

  <div class="deco-border-bottom"></div>
</div>
</body>
</html>
