<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · Wabi-Sabi 侘寂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+SC:wght@200;300;400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", "Noto Serif SC", "PingFang SC", serif;
    background: #d5cec5;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: #f5f0e8;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    position: relative;
  }

  /* Texture overlay */
  .poster::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8b0a6' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.3;
    pointer-events: none;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 48px 36px 32px;
    position: relative;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    opacity: 0.85;
  }
  .brand {
    font-size: 10px;
    color: #a09888;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-weight: 300;
  }
  .main-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 36px;
    font-weight: 300;
    color: #3a3530;
    line-height: 1.3;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .sub-title {
    font-size: 14px;
    color: #8a8278;
    font-weight: 300;
    font-style: italic;
    letter-spacing: 1px;
  }

  /* Divider */
  .divider {
    margin: 0 36px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c4bdb3, transparent);
  }
  .divider-dot {
    width: 4px;
    height: 4px;
    background: #c4bdb3;
    border-radius: 50%;
  }

  /* Stats */
  .stats {
    display: flex;
    margin: 0 36px 32px;
    gap: 16px;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    border: 1px solid rgba(180, 172, 160, 0.2);
    position: relative;
  }
  .stat::before {
    content: '';
    position: absolute;
    top: -1px; left: 30%; right: 30%;
    height: 1px;
    background: #b4aca0;
  }
  .stat-num {
    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 300;
    color: #3a3530;
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    color: #9a9288;
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* Journey */
  .journey {
    margin: 0 36px 32px;
    padding: 20px;
    background: rgba(255,255,255,0.3);
    border: 1px solid rgba(180, 172, 160, 0.15);
  }
  .journey-label {
    font-size: 10px;
    color: #a09888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: center;
    font-weight: 300;
  }
  .journey-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .j-dot {
    font-size: 12px;
    color: #5a5448;
    font-weight: 300;
  }
  .j-sep {
    color: #b4aca0;
    font-size: 10px;
  }

  /* Quote */
  .quote {
    margin: 0 36px 32px;
    padding: 28px;
    border-left: 1px solid #b4aca0;
    position: relative;
  }
  .quote::before {
    content: '';
    position: absolute;
    top: 0; left: -1px;
    width: 1px; height: 20px;
    background: #8a8278;
  }
  .quote-text {
    font-family: "Cormorant Garamond", serif;
    font-size: 16px;
    color: #5a5448;
    line-height: 1.9;
    font-style: italic;
    font-weight: 300;
  }

  /* Footer */
  .footer {
    padding: 32px 36px 40px;
    text-align: center;
  }
  .qr-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 12px;
    padding: 4px;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(180, 172, 160, 0.3);
  }
  .qr-wrap img {
    width: 92px;
    height: 92px;
    display: block;
    opacity: 0.9;
  }
  .qr-text {
    font-size: 12px;
    color: #5a5448;
    font-weight: 400;
    letter-spacing: 2px;
  }
  .qr-sub {
    font-size: 10px;
    color: #a09888;
    margin-top: 4px;
    font-weight: 300;
  }
  .slogan {
    margin-top: 20px;
    font-size: 11px;
    color: #b4aca0;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="header">
    <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    <div class="brand">S L O T H  M A S T E R</div>
    
    <div class="sub-title">慢一点，深一度</div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">28</div>
      <div class="stat-label">年</div>
    </div>
    <div class="stat">
      <div class="stat-num">6</div>
      <div class="stat-label">方法论</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">智能体</div>
    </div>
    <div class="stat">
      <div class="stat-num">400+</div>
      <div class="stat-label">原创</div>
    </div>
  </div>

  <div class="journey">
    <div class="journey-label">旅 程</div>
    <div class="journey-dots">
      <span class="j-dot">中石化</span>
      <span class="j-sep">·</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-sep">·</span>
      <span class="j-dot">毕博</span>
      <span class="j-sep">·</span>
      <span class="j-dot">德勤</span>
      <span class="j-sep">·</span>
      <span class="j-dot"></span>
    </div>
  </div>

  <div class="quote">
    <div class="quote-text">技术从来不缺，缺的是让组织接住技术的方法。慢一点，深一度，在时间中找到自己的节奏。</div>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="qr-text">树懒老K · 个人网站</div>
    <div class="qr-sub">扫码访问，获取更多AI转型方法论</div>
    <div class="slogan">慢 一 点 深 一 度</div>
  </div>
</div>
</body>
</html>
