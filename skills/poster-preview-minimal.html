<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · 极简留白风</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: #ffffff;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }

  /* Avatar */
  .avatar-section {
    padding: 48px 40px 0;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
  }
  .brand-name {
    font-size: 13px;
    color: #999;
    letter-spacing: 2px;
    font-weight: 400;
  }

  /* Title */
  .title-section {
    padding: 56px 40px 0;
  }
  .main-title {
    font-size: 36px;
    font-weight: 200;
    color: #1a1a1a;
    line-height: 1.4;
    letter-spacing: -0.5px;
  }
  .main-title strong {
    font-weight: 600;
  }
  .divider {
    width: 32px;
    height: 1px;
    background: #1a1a1a;
    margin: 32px 0;
  }

  /* Quote */
  .quote-section {
    padding: 0 40px;
  }
  .quote-text {
    font-size: 14px;
    color: #666;
    line-height: 2;
    font-weight: 300;
  }

  /* Stats */
  .stats-section {
    padding: 48px 40px;
    display: flex;
    gap: 32px;
  }
  .stat {
    flex: 1;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 200;
    color: #1a1a1a;
  }
  .stat-label {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* Journey */
  .journey-section {
    padding: 0 40px 48px;
  }
  .journey-label {
    font-size: 10px;
    color: #bbb;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .journey-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .j-dot {
    font-size: 11px;
    color: #999;
    font-weight: 400;
  }
  .j-sep {
    color: #ddd;
  }

  /* Footer */
  .footer {
    padding: 32px 40px 48px;
    display: flex;
    align-items: flex-end;
    gap: 24px;
  }
  .qr-wrap {
    width: 80px;
    height: 80px;
    padding: 4px;
    background: #f9f9f9;
    border-radius: 4px;
  }
  .qr-wrap img {
    width: 72px;
    height: 72px;
    display: block;
    border-radius: 2px;
  }
  .footer-text {
    flex: 1;
  }
  .footer-title {
    font-size: 12px;
    color: #1a1a1a;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .footer-sub {
    font-size: 10px;
    color: #bbb;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="avatar-section">
    <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    <div class="brand-name">SLOTH MASTER</div>
  </div>

  <div class="title-section">
    <div class="main-title">
      <br>
      慢一点，深一度
    </div>
    <div class="divider"></div>
  </div>

  <div class="quote-section">
    <div class="quote-text">
      技术从来不缺，缺的是让组织接住技术的方法。28年，从能源巨头到跨国咨询，把经验蒸馏为可复用的方法论。
    </div>
  </div>

  <div class="stats-section">
    <div class="stat">
      <div class="stat-num">28</div>
      <div class="stat-label">年</div>
    </div>
    <div class="stat">
      <div class="stat-num">6</div>
      <div class="stat-label">方法论</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">智能体</div>
    </div>
    <div class="stat">
      <div class="stat-num">400+</div>
      <div class="stat-label">原创</div>
    </div>
  </div>

  <div class="journey-section">
    <div class="journey-label">Journey</div>
    <div class="journey-dots">
      <span class="j-dot">中石化</span>
      <span class="j-sep">/</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-sep">/</span>
      <span class="j-dot">毕博</span>
      <span class="j-sep">/</span>
      <span class="j-dot">德勤</span>
      <span class="j-sep">/</span>
      <span class="j-dot"></span>
    </div>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="footer-text">
      <div class="footer-title">wangguobao0215.github.io</div>
      <div class="footer-sub">扫码访问个人网站</div>
    </div>
  </div>
</div>
</body>
</html>
