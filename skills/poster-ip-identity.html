<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · 我是树懒老K</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #D8E0EA;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: linear-gradient(170deg, #EDF1F6 0%, #E2E8F0 40%, #D6DEE8 100%);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 16px 56px rgba(90, 122, 150, 0.12), 0 4px 12px rgba(90, 122, 150, 0.06);
    position: relative;
  }
  .poster::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90, 122, 150, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .poster::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90, 122, 150, 0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 44px 32px 28px;
    position: relative;
  }
  .avatar-wrap {
    width: 96px; height: 96px;
    margin: 0 auto 16px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #5A7A96, #3D5A78);
    box-shadow: 0 8px 24px rgba(90, 122, 150, 0.25);
  }
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #EDF1F6;
    display: block;
  }
  .brand {
    font-size: 13px;
    color: #6B8299;
    letter-spacing: 6px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .main-title {
    font-size: 32px;
    font-weight: 800;
    color: #334155;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .sub-title {
    font-size: 14px;
    color: #64748B;
    line-height: 1.5;
  }

  /* Journey */
  .journey {
    margin: 0 28px 24px;
    padding: 18px 20px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 16px;
    border: 1px dashed rgba(90, 122, 150, 0.35);
    text-align: center;
  }
  .journey-label {
    font-size: 11px;
    color: #6B8299;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  .journey-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .j-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .j-dot:nth-child(1) { background: #c92a2a; }
  .j-dot:nth-child(2) { background: #e8590c; }
  .j-dot:nth-child(3) { background: #0055aa; }
  .j-dot:nth-child(4) { background: #1a4a3a; }
  .j-dot:nth-child(5) { background: #5A7A96; }
  .j-arrow {
    color: #5A7A96;
    font-size: 12px;
  }

  /* Stats */
  .stats {
    display: flex;
    justify-content: space-around;
    margin: 0 28px 24px;
    gap: 10px;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    border: 1px solid rgba(90, 122, 150, 0.15);
  }
  .stat-num {
    font-size: 26px;
    font-weight: 800;
    color: #5A7A96;
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: #6B8299;
    margin-top: 6px;
  }

  /* Quote */
  .quote {
    margin: 0 28px 28px;
    padding: 22px 24px;
    background: rgba(90, 122, 150, 0.08);
    border-radius: 16px;
    border-left: 4px solid #5A7A96;
    position: relative;
  }
  .quote::before {
    content: '"';
    position: absolute;
    top: 8px; left: 14px;
    font-size: 36px;
    color: rgba(90, 122, 150, 0.2);
    font-family: Georgia, serif;
    line-height: 1;
  }
  .quote p {
    font-size: 14px;
    color: #3D4F5F;
    line-height: 1.8;
    font-style: italic;
    position: relative;
    z-index: 1;
  }
  .quote-source {
    font-size: 12px;
    color: #64748B;
    margin-top: 10px;
    text-align: right;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 0 32px 36px;
  }
  .qr-wrap {
    width: 140px;
    height: 140px;
    margin: 0 auto 14px;
    padding: 8px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(90, 122, 150, 0.08);
  }
  .qr-wrap img {
    width: 124px;
    height: 124px;
    display: block;
    border-radius: 8px;
  }
  .qr-text {
    font-size: 13px;
    color: #4A5568;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .qr-sub {
    font-size: 11px;
    color: #6B8299;
  }
  .slogan {
    margin-top: 18px;
    font-size: 12px;
    color: #94A3B8;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="poster">

    <div class="avatar-wrap">
      <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    </div>
    <div class="brand">S L O T H  M A S T E R</div>
    <div class="main-title"></div>
    <div class="sub-title">一个相信"慢一点，深一度"的<br>企业AI转型方法论架构师</div>
  </div>

  <div class="journey">

    <div class="journey-dots">
      <span class="j-dot">中石化</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">毕博</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">德勤</span>
      <span class="j-arrow">→</span>

    </div>
  </div>

  <div class="stats">
    <div class="stat">

    </div>
    <div class="stat">

      <div class="stat-label">套方法论</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>

    </div>
    <div class="stat">
      <div class="stat-num">400+</div>
      <div class="stat-label">篇原创</div>
    </div>
  </div>

  <div class="quote">
    <p>技术从来不缺，缺的是让组织接住技术的方法。所以我做的事很简单——把28年经验蒸馏为可复用的方法论，帮企业和个人建立<strong>定义问题、梳理问题、做出判断</strong>这三种AI时代最需要的能力。</p>
    <div class="quote-source">—— 树懒老K</div>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="qr-text">树懒老K · 慢一点深一度</div>
    <div class="qr-sub">扫码访问个人网站，获取更多AI转型方法论</div>
    <div class="slogan">慢一点 · 深一度</div>
  </div>
</div>
</body>
</html>
