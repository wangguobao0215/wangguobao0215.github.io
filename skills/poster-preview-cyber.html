<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · 赛博科技风</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: linear-gradient(180deg, #0d0d1a 0%, #0a0a12 50%, #0d0d0d 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0, 255, 200, 0.08), 0 0 120px rgba(120, 0, 255, 0.04);
    position: relative;
  }
  .poster::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(90deg, transparent 49.5%, rgba(0, 255, 200, 0.03) 50%, transparent 50.5%),
      linear-gradient(0deg, transparent 49.5%, rgba(0, 255, 200, 0.03) 50%, transparent 50.5%);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 32px 24px;
    position: relative;
  }
  .glow-line {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ffc8, transparent);
    margin: 0 auto 20px;
  }
  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #00ffc8;
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.3), inset 0 0 10px rgba(0, 255, 200, 0.1);
    margin-bottom: 16px;
  }
  .brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: #00ffc8;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
  }
  .main-title {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #00ffc8, #00a8ff, #7800ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .sub-title {
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
  }

  /* Stats */
  .stats {
    display: flex;
    margin: 0 24px 24px;
    gap: 12px;
    position: relative;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    background: rgba(0, 255, 200, 0.03);
    border: 1px solid rgba(0, 255, 200, 0.1);
    border-radius: 8px;
    position: relative;
  }
  .stat::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ffc8, transparent);
  }
  .stat-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #00ffc8;
    text-shadow: 0 0 8px rgba(0, 255, 200, 0.4);
  }
  .stat-label {
    font-size: 10px;
    color: #666;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* Abilities */
  .abilities {
    margin: 0 24px 24px;
    padding: 20px;
    background: rgba(120, 0, 255, 0.03);
    border: 1px solid rgba(120, 0, 255, 0.1);
    border-radius: 12px;
    position: relative;
  }
  .abilities::after {
    content: '';
    position: absolute;
    top: -1px; left: 15%; right: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #7800ff, transparent);
  }
  .ab-title {
    font-size: 11px;
    color: #7800ff;
    letter-spacing: 3px;
    margin-bottom: 14px;
    text-align: center;
  }
  .ab-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .ab-item:last-child { margin-bottom: 0; }
  .ab-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ffc8;
    box-shadow: 0 0 8px rgba(0, 255, 200, 0.5);
  }
  .ab-text {
    font-size: 13px;
    color: #aaa;
  }
  .ab-text strong {
    color: #00ffc8;
  }

  /* Journey */
  .journey {
    margin: 0 24px 24px;
    padding: 16px 20px;
    background: rgba(0, 168, 255, 0.03);
    border: 1px solid rgba(0, 168, 255, 0.08);
    border-radius: 8px;
  }
  .j-label {
    font-size: 10px;
    color: #00a8ff;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-align: center;
  }
  .j-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .j-dot {
    font-size: 11px;
    color: #888;
    padding: 3px 8px;
    border: 1px solid rgba(0, 168, 255, 0.2);
    border-radius: 4px;
  }
  .j-arrow {
    color: #00a8ff;
    font-size: 10px;
  }

  /* Quote */
  .quote {
    margin: 0 24px 24px;
    padding: 16px 20px;
    border-left: 2px solid #00ffc8;
    background: rgba(0, 255, 200, 0.02);
  }
  .quote p {
    font-size: 13px;
    color: #aaa;
    line-height: 1.8;
    font-style: italic;
  }
  .quote strong {
    color: #00ffc8;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 0 32px 36px;
  }
  .qr-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 12px;
    padding: 6px;
    background: #0d0d1a;
    border: 1px solid rgba(0, 255, 200, 0.15);
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.05);
  }
  .qr-wrap img {
    width: 108px;
    height: 108px;
    display: block;
    border-radius: 4px;
  }
  .qr-text {
    font-size: 12px;
    color: #00ffc8;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .qr-sub {
    font-size: 10px;
    color: #666;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="header">
    <div class="glow-line"></div>
    <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    <div class="brand">S L O T H  M A S T E R</div>
    
    <div class="sub-title">AI 转 型 方 法 论 架 构 师</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">28</div>
      <div class="stat-label">年跨度</div>
    </div>
    <div class="stat">
      <div class="stat-num">6</div>
      <div class="stat-label">方法论</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">智能体</div>
    </div>
  </div>

  <div class="abilities">
    <div class="ab-title">核 心 能 力</div>
    <div class="ab-item">
      <div class="ab-dot"></div>
      <div class="ab-text"><strong>定义问题</strong> — 先定义对的问题，再找对的方法</div>
    </div>
    <div class="ab-item">
      <div class="ab-dot"></div>
      <div class="ab-text"><strong>梳理问题</strong> — 把复杂变简单，把模糊变清晰</div>
    </div>
    <div class="ab-item">
      <div class="ab-dot"></div>
      <div class="ab-text"><strong>做出判断</strong> — 不盲从，不犹豫，做对的选择</div>
    </div>
  </div>

  <div class="journey">
    <div class="j-label">职 业 旅 程</div>
    <div class="j-dots">
      <span class="j-dot">中石化</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">毕博</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">德勤</span>
      <span class="j-arrow">→</span>
      <span class="j-dot"></span>
    </div>
  </div>

  <div class="quote">
    <p>"技术从来不缺，缺的是让组织接住技术的方法。"</p>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="qr-text">S C A N  T O  V I S I T</div>
    <div class="qr-sub">扫码访问个人网站</div>
  </div>
</div>
</body>
</html>
