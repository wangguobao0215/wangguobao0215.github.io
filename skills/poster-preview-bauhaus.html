<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树懒老K · Bauhaus 包豪斯</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", sans-serif;
    background: #e8e8e8;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .poster {
    width: 440px;
    background: #f0f0f0;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    position: relative;
  }

  /* Primary Color Bar */
  .color-bar {
    display: flex;
    height: 12px;
  }
  .cb-red { background: #e60012; flex: 1; }
  .cb-yellow { background: #ffde00; flex: 1; }
  .cb-blue { background: #0055a4; flex: 1; }

  /* Header */
  .header {
    padding: 32px 36px 24px;
    position: relative;
  }
  .avatar-wrap {
    width: 48px;
    height: 48px;
    background: #0055a4;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .avatar {
    width: 44px;
    height: 44px;
    object-fit: cover;
    display: block;
  }
  .brand {
    font-size: 10px;
    color: #999;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .main-title {
    font-size: 40px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.1;
    margin-bottom: 8px;
    letter-spacing: -1px;
  }
  .sub-title {
    font-size: 14px;
    color: #666;
    font-weight: 300;
  }

  /* Geometric Block */
  .geo-block {
    display: grid;
    grid-template-columns: 2fr 1fr;
    margin: 0 36px 24px;
    gap: 4px;
  }
  .geo-red {
    background: #e60012;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .geo-red-num {
    font-size: 48px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }
  .geo-red-label {
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    margin-top: 4px;
    font-weight: 500;
  }
  .geo-right {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .geo-blue {
    background: #0055a4;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
  }
  .geo-yellow {
    background: #ffde00;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a1a1a;
    font-size: 24px;
    font-weight: 700;
  }

  /* Stats Grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    margin: 0 36px 24px;
    gap: 4px;
  }
  .stat {
    padding: 16px;
    text-align: center;
  }
  .stat:nth-child(1) { background: #0055a4; }
  .stat:nth-child(2) { background: #ffde00; }
  .stat:nth-child(3) { background: #e60012; }
  .stat:nth-child(4) { background: #1a1a1a; }
  .stat-num {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }
  .stat:nth-child(2) .stat-num, .stat:nth-child(3) .stat-num { color: #1a1a1a; }
  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    margin-top: 4px;
    font-weight: 500;
  }
  .stat:nth-child(2) .stat-label, .stat:nth-child(3) .stat-label { color: rgba(0,0,0,0.6); }

  /* Journey */
  .journey {
    margin: 0 36px 24px;
    padding: 16px 20px;
    border: 4px solid #1a1a1a;
    border-top: none;
    position: relative;
  }
  .journey::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #e60012 0%, #e60012 33%, #ffde00 33%, #ffde00 66%, #0055a4 66%, #0055a4 100%);
  }
  .journey-label {
    font-size: 10px;
    color: #999;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .journey-dots {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .j-dot {
    font-size: 12px;
    color: #1a1a1a;
    font-weight: 500;
  }
  .j-arrow {
    color: #e60012;
    font-weight: 700;
  }

  /* Quote */
  .quote {
    margin: 0 36px 24px;
    padding: 20px;
    background: #1a1a1a;
    position: relative;
  }
  .quote::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 40px; height: 4px;
    background: #e60012;
  }
  .quote-text {
    font-size: 14px;
    color: #fff;
    line-height: 1.7;
    font-weight: 300;
  }
  .quote-text strong {
    color: #ffde00;
    font-weight: 600;
  }

  /* Footer */
  .footer {
    padding: 24px 36px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .qr-wrap {
    width: 72px;
    height: 72px;
    padding: 4px;
    background: #fff;
    border: 3px solid #1a1a1a;
  }
  .qr-wrap img {
    width: 64px;
    height: 64px;
    display: block;
  }
  .footer-info {
    flex: 1;
  }
  .footer-name {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 2px;
  }
  .footer-url {
    font-size: 11px;
    color: #666;
  }
  .footer-accent {
    width: 24px;
    height: 24px;
    background: #e60012;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="color-bar">
    <div class="cb-red"></div>
    <div class="cb-yellow"></div>
    <div class="cb-blue"></div>
  </div>

  <div class="header">
    <div class="avatar-wrap">
      <img src="../assets/logo-new.png" alt="树懒老K" class="avatar" onerror="this.style.display='none'" style="width: 200px; height: auto; border-radius: 0; object-fit: contain; display: block;" >
    </div>
    <div class="brand">S L O T H  M A S T E R</div>
    
    <div class="sub-title">AI转型方法论架构师</div>
  </div>

  <div class="geo-block">
    <div class="geo-red">
      <div class="geo-red-num">28</div>
      <div class="geo-red-label">Years Experience</div>
    </div>
    <div class="geo-right">
      <div class="geo-blue">6</div>
      <div class="geo-yellow">24</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">6</div>
      <div class="stat-label">方法论</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">智能体</div>
    </div>
    <div class="stat">
      <div class="stat-num">400+</div>
      <div class="stat-label">原创</div>
    </div>
    <div class="stat">
      <div class="stat-num">5</div>
      <div class="stat-label">段旅程</div>
    </div>
  </div>

  <div class="journey">
    <div class="journey-label">Career Path</div>
    <div class="journey-dots">
      <span class="j-dot">中石化</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">霍尼韦尔</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">毕博</span>
      <span class="j-arrow">→</span>
      <span class="j-dot">德勤</span>
      <span class="j-arrow">→</span>
      <span class="j-dot"></span>
    </div>
  </div>

  <div class="quote">
    <div class="quote-text">技术从来不缺，缺的是让组织<strong>接住技术</strong>的方法。</div>
  </div>

  <div class="footer">
    <div class="qr-wrap">
      <img src="../assets/qrcode-poster.png" alt="OPC网站二维码">
    </div>
    <div class="footer-info">
      <div class="footer-name">SLOTH MASTER</div>
      <div class="footer-url">wangguobao0215.github.io</div>
    </div>
    <div class="footer-accent"></div>
  </div>
</div>
</body>
</html>
